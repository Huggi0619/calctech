        // ===== ENERGIEKOSTEN =====
        function initEnergiekostenCalculator() {
            const inputs = {
                P:      document.getElementById('ek-p'),
                htag:   document.getElementById('ek-htag'),
                hnacht: document.getElementById('ek-hnacht'),
                tage:   document.getElementById('ek-tage'),
                prtag:  document.getElementById('ek-prtag'),
                prnacht:document.getElementById('ek-prnacht'),
                ctag:   document.getElementById('ek-ctag'),
                cnacht: document.getElementById('ek-cnacht'),
                ctotal: document.getElementById('ek-ctotal')
            };
            const btnCalc = document.getElementById('ek-calc-btn');
            const btnClear = document.getElementById('ek-clear-btn');
            const errBox  = document.getElementById('ek-error-box');

            Object.values(inputs).forEach(inp => {
                inp.addEventListener('input', () => { inp.style.color = 'var(--text-normal)'; inp.style.fontWeight = 'normal'; errBox.style.display = 'none'; });
                inp.addEventListener('keydown', e => { if (e.key === 'Enter') calc(); });
            });
            btnClear.addEventListener('click', () => {
                Object.values(inputs).forEach(inp => { inp.value = ''; inp.style.color = 'var(--text-normal)'; inp.style.fontWeight = 'normal'; });
                errBox.style.display = 'none';
            });
            btnCalc.addEventListener('click', calc);

            function calc() {
                errBox.style.display = 'none';
                const v = {};
                for (const k in inputs) { const s = inputs[k].value.trim(); v[k] = s !== '' ? parseFloat(s.replace(',', '.')) : null; }
                const orig = { ...v };

                const pos = ['P','htag','hnacht','tage','prtag','prnacht','ctag','cnacht','ctotal'];
                for (const k of pos) { if (v[k] !== null && v[k] < 0) { showErr(`${k} darf nicht negativ sein.`); return; } }
                if (Object.values(orig).filter(x => x !== null).length < 2) { showErr('Bitte mindestens 2 Werte eingeben.'); return; }

                // cost = P[W] · h[h] · tage · pr[Rp/kWh] / 100000
                // (1 kWh = 1000 Wh; 1 CHF = 100 Rp → factor = 1/1000/100 = 1/100000)
                for (let i = 0; i < 10; i++) {
                    const prev = JSON.stringify(v);

                    // cost_tag = P · htag · tage · prtag / 100000
                    const kt = (a, b, c, d) => a * b * c * d / 100000;
                    const nn = (...xs) => xs.every(x => x !== null && x !== 0);

                    if (v.P !== null && v.htag !== null && v.tage !== null && v.prtag !== null && v.ctag === null)
                        v.ctag = kt(v.P, v.htag, v.tage, v.prtag);
                    if (v.ctag !== null && v.htag !== null && v.tage !== null && v.prtag !== null && v.P === null && nn(v.htag, v.tage, v.prtag))
                        v.P = v.ctag * 100000 / (v.htag * v.tage * v.prtag);
                    if (v.ctag !== null && v.P !== null && v.tage !== null && v.prtag !== null && v.htag === null && nn(v.P, v.tage, v.prtag))
                        v.htag = v.ctag * 100000 / (v.P * v.tage * v.prtag);
                    if (v.ctag !== null && v.P !== null && v.htag !== null && v.prtag !== null && v.tage === null && nn(v.P, v.htag, v.prtag))
                        v.tage = v.ctag * 100000 / (v.P * v.htag * v.prtag);
                    if (v.ctag !== null && v.P !== null && v.htag !== null && v.tage !== null && v.prtag === null && nn(v.P, v.htag, v.tage))
                        v.prtag = v.ctag * 100000 / (v.P * v.htag * v.tage);

                    // cost_nacht = P · hnacht · tage · prnacht / 100000
                    if (v.P !== null && v.hnacht !== null && v.tage !== null && v.prnacht !== null && v.cnacht === null)
                        v.cnacht = kt(v.P, v.hnacht, v.tage, v.prnacht);
                    if (v.cnacht !== null && v.hnacht !== null && v.tage !== null && v.prnacht !== null && v.P === null && nn(v.hnacht, v.tage, v.prnacht))
                        v.P = v.cnacht * 100000 / (v.hnacht * v.tage * v.prnacht);
                    if (v.cnacht !== null && v.P !== null && v.tage !== null && v.prnacht !== null && v.hnacht === null && nn(v.P, v.tage, v.prnacht))
                        v.hnacht = v.cnacht * 100000 / (v.P * v.tage * v.prnacht);
                    if (v.cnacht !== null && v.P !== null && v.hnacht !== null && v.prnacht !== null && v.tage === null && nn(v.P, v.hnacht, v.prnacht))
                        v.tage = v.cnacht * 100000 / (v.P * v.hnacht * v.prnacht);
                    if (v.cnacht !== null && v.P !== null && v.hnacht !== null && v.tage !== null && v.prnacht === null && nn(v.P, v.hnacht, v.tage))
                        v.prnacht = v.cnacht * 100000 / (v.P * v.hnacht * v.tage);

                    // cost_total = cost_tag + cost_nacht
                    if (v.ctag !== null && v.cnacht !== null && v.ctotal === null) v.ctotal = v.ctag + v.cnacht;
                    if (v.ctotal !== null && v.ctag !== null && v.cnacht === null) v.cnacht = v.ctotal - v.ctag;
                    if (v.ctotal !== null && v.cnacht !== null && v.ctag === null) v.ctag = v.ctotal - v.cnacht;

                    if (JSON.stringify(v) === prev) break;
                }

                const fmt = x => x === null || !isFinite(x) ? '' : parseFloat(x.toPrecision(5)).toString();
                for (const k in v) {
                    if (v[k] !== null && isFinite(v[k])) {
                        inputs[k].value = fmt(v[k]);
                        if (orig[k] === null) { inputs[k].style.color = '#60a5fa'; inputs[k].style.fontWeight = 'bold'; }
                    }
                }
            }
            function showErr(msg) { errBox.innerHTML = msg; errBox.style.display = 'block'; }
        }

        // ===== WIDERSTAND FARBCODE =====
        function initFarbcodeCalculator() {
            const FC = [
                { name: 'Schwarz', digit: 0, mult: 1,      tol: null,       hex: '#000000' },
                { name: 'Braun',   digit: 1, mult: 10,     tol: '±1%',      hex: '#8B4513' },
                { name: 'Rot',     digit: 2, mult: 100,    tol: '±2%',      hex: '#CC2200' },
                { name: 'Orange',  digit: 3, mult: 1e3,    tol: null,       hex: '#FF8C00' },
                { name: 'Gelb',    digit: 4, mult: 1e4,    tol: null,       hex: '#DDCC00' },
                { name: 'Grün',    digit: 5, mult: 1e5,    tol: '±0.5%',    hex: '#007700' },
                { name: 'Blau',    digit: 6, mult: 1e6,    tol: '±0.25%',   hex: '#0044CC' },
                { name: 'Violett', digit: 7, mult: 1e7,    tol: '±0.1%',    hex: '#7700BB' },
                { name: 'Grau',    digit: 8, mult: 1e8,    tol: '±0.05%',   hex: '#888888' },
                { name: 'Weiß',    digit: 9, mult: 1e9,    tol: null,       hex: '#E8E8E8' },
                { name: 'Gold',    digit: null, mult: 0.1, tol: '±5%',      hex: '#CCAA00' },
                { name: 'Silber',  digit: null, mult: 0.01,tol: '±10%',     hex: '#AAAAAA' },
            ];
            const digits = FC.filter(c => c.digit !== null);
            const tols   = FC.filter(c => c.tol   !== null);

            // Tab switching
            const tabA = document.getElementById('fc-tab-a');
            const tabB = document.getElementById('fc-tab-b');
            const panA = document.getElementById('fc-panel-a');
            const panB = document.getElementById('fc-panel-b');
            const ON  = 'flex:1;text-align:center;padding:10px 14px;cursor:pointer;background:var(--accent-color);color:#fff;font-size:13px;font-weight:600;';
            const OFF = 'flex:1;text-align:center;padding:10px 14px;cursor:pointer;background:#3c3c3c;color:#858585;font-size:13px;font-weight:600;';
            function setTab(m) {
                if (m === 'A') { tabA.style.cssText = ON;  tabB.style.cssText = OFF; panA.style.display = ''; panB.style.display = 'none'; }
                else           { tabB.style.cssText = ON;  tabA.style.cssText = OFF; panB.style.display = ''; panA.style.display = 'none'; }
            }
            tabA.addEventListener('click', () => setTab('A'));
            tabB.addEventListener('click', () => setTab('B'));

            // Selects & swatches (0-indexed: sel[0]=Ring1 … sel[4]=Ring5)
            const sels = [1,2,3,4,5].map(i => document.getElementById(`fc-sel-${i}`));
            const sws  = [1,2,3,4,5].map(i => document.getElementById(`fc-sw-${i}`));

            function mkOpt(name, extra) {
                const o = document.createElement('option');
                o.value = name;
                o.textContent = extra !== undefined ? `${name} — ${extra}` : name;
                return o;
            }
            function fmtMult(m) {
                if (m >= 1e9) return `×${m/1e9} GΩ`;
                if (m >= 1e6) return `×${m/1e6} MΩ`;
                if (m >= 1e3) return `×${m/1e3} kΩ`;
                return `×${m}`;
            }

            // Ring 1-3: digits only
            [0,1,2].forEach(i => {
                sels[i].innerHTML = '';
                digits.forEach(c => sels[i].appendChild(mkOpt(c.name, c.digit)));
            });
            // Ring 4: all 12 colors as multiplier
            sels[3].innerHTML = '';
            FC.forEach(c => sels[3].appendChild(mkOpt(c.name, fmtMult(c.mult))));
            // Ring 5: tol colors + "keine"
            sels[4].innerHTML = '<option value="">— keine —</option>';
            tols.forEach(c => sels[4].appendChild(mkOpt(c.name, c.tol)));

            const findC = name => FC.find(c => c.name === name) || null;

            function swBorder(c) { return c.name === 'Schwarz' ? '#666' : c.name === 'Weiß' ? '#bbb' : c.hex; }
            function updateSwatch(i) {
                const c = findC(sels[i].value);
                sws[i].style.background = c ? c.hex : '#2a2a2a';
                sws[i].style.border     = '1px solid ' + (c ? swBorder(c) : '#555');
            }

            function fmtR(v) {
                if (!isFinite(v) || v <= 0) return '?';
                if (v >= 1e9) return parseFloat((v/1e9).toPrecision(4)) + ' GΩ';
                if (v >= 1e6) return parseFloat((v/1e6).toPrecision(4)) + ' MΩ';
                if (v >= 1e3) return parseFloat((v/1e3).toPrecision(4)) + ' kΩ';
                return parseFloat(v.toPrecision(4)) + ' Ω';
            }

            function calcA() {
                sels.forEach((_, i) => updateSwatch(i));
                const resEl = document.getElementById('fc-result-a');
                const c1 = findC(sels[0].value), c2 = findC(sels[1].value);
                const c3 = findC(sels[2].value), c4 = findC(sels[3].value);
                if (!c1 || !c2 || !c3 || !c4) { resEl.innerHTML = '—'; return; }
                const R = (c1.digit * 100 + c2.digit * 10 + c3.digit) * c4.mult;
                let html = `R = <strong style="color:#60a5fa;font-size:20px;">${fmtR(R)}</strong>`;
                const tolVal = sels[4].value;
                if (tolVal) {
                    const c5 = findC(tolVal);
                    html += ` <span style="color:#fbbf24;">${c5.tol}</span>`;
                    const pct = parseFloat(c5.tol.replace('±','').replace('%','')) / 100;
                    html += `<span style="font-size:12px;color:var(--text-muted);margin-top:4px;display:block;">Toleranzbereich: [${fmtR(R*(1-pct))} … ${fmtR(R*(1+pct))}]</span>`;
                }
                resEl.innerHTML = html;
            }

            sels.forEach((s, i) => s.addEventListener('change', () => { updateSwatch(i); calcA(); }));
            document.getElementById('fc-clear-a').addEventListener('click', () => {
                sels[0].value = 'Braun'; sels[1].value = 'Schwarz'; sels[2].value = 'Schwarz';
                sels[3].value = 'Braun'; sels[4].value = 'Gold';
                sels.forEach((_, i) => updateSwatch(i)); calcA();
            });

            // Default: Braun, Schwarz, Schwarz, Braun, Gold = 1 kΩ ±5%
            sels[0].value = 'Braun'; sels[1].value = 'Schwarz'; sels[2].value = 'Schwarz';
            sels[3].value = 'Braun'; sels[4].value = 'Gold';
            sels.forEach((_, i) => updateSwatch(i));
            calcA();

            // === MODE B ===
            const bInp   = document.getElementById('fc-b-inp');
            const bCalc  = document.getElementById('fc-calc-b');
            const bClear = document.getElementById('fc-clear-b');
            const errB   = document.getElementById('fc-error-b');
            const ringsEl = document.getElementById('fc-rings-b');
            const resB    = document.getElementById('fc-result-b');

            function nameCol(c) { return c.name === 'Schwarz' ? '#aaaaaa' : c.name === 'Weiß' ? '#dddddd' : c.hex; }

            function calcB() {
                errB.style.display = 'none';
                const raw = bInp.value.trim().replace(/\s*[ΩohmsOhms]+$/i, '').trim();
                if (!raw) { ringsEl.innerHTML = ''; resB.innerHTML = ''; return; }
                const R = bkParseVal(raw);
                if (R === null || R <= 0 || !isFinite(R)) {
                    errB.innerHTML = 'Ungültiger Widerstandswert.'; errB.style.display = 'block';
                    ringsEl.innerHTML = ''; resB.innerHTML = ''; return;
                }
                if (R < 1) {
                    errB.innerHTML = 'Wert zu klein — 5-Band-Code gilt ab 1 Ω.'; errB.style.display = 'block';
                    ringsEl.innerHTML = ''; resB.innerHTML = ''; return;
                }
                const exp  = Math.floor(Math.log10(R)) - 2;
                const pow  = Math.pow(10, exp);
                let mant   = Math.round(R / pow);
                if (mant > 999) mant = 999;
                if (mant < 100) mant = 100;
                const d1 = Math.floor(mant / 100);
                const d2 = Math.floor((mant % 100) / 10);
                const d3 = mant % 10;
                const c1 = FC.find(c => c.digit === d1);
                const c2 = FC.find(c => c.digit === d2);
                const c3 = FC.find(c => c.digit === d3);
                const cm = FC.reduce((best, c) =>
                    Math.abs(Math.log10(c.mult) - exp) < Math.abs(Math.log10(best.mult) - exp) ? c : best
                );
                const bands = [{ c: c1, lbl: 'Ring 1' }, { c: c2, lbl: 'Ring 2' },
                               { c: c3, lbl: 'Ring 3' }, { c: cm, lbl: 'Mult' }];
                ringsEl.innerHTML = bands.map(({ c, lbl }) => `
                    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
                        <div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;">${lbl}</div>
                        <div style="width:34px;height:64px;background:${c.hex};border-radius:6px;
                             border:2px solid ${swBorder(c)};box-shadow:0 2px 8px rgba(0,0,0,0.5);"></div>
                        <div style="font-size:11px;font-family:var(--mono-font);color:${nameCol(c)};">${c.name}</div>
                    </div>`).join('');
                const Rout = (d1*100 + d2*10 + d3) * cm.mult;
                resB.innerHTML = `R ≈ <strong>${fmtR(Rout)}</strong>`;
            }

            bInp.addEventListener('input', calcB);
            bCalc.addEventListener('click', calcB);
            bClear.addEventListener('click', () => {
                bInp.value = ''; bInp.style.color = 'var(--text-normal)';
                ringsEl.innerHTML = ''; resB.innerHTML = ''; errB.style.display = 'none';
            });
        }

        // ===== BATTERIE / INNENWIDERSTAND =====
        function initBatterieCalculator() {
            const fields = ['e','ri','isc','ra','uk','i','pa','pi','pges'];
            const inputs = {};
            fields.forEach(k => inputs[k] = document.getElementById(`bat-${k}`));
            const btnCalc  = document.getElementById('bat-calc-btn');
            const btnClear = document.getElementById('bat-clear-btn');
            const errBox   = document.getElementById('bat-error-box');

            Object.values(inputs).forEach(inp => {
                inp.addEventListener('input', () => { inp.style.color = 'var(--text-normal)'; inp.style.fontWeight = 'normal'; errBox.style.display = 'none'; });
                inp.addEventListener('keydown', e => { if (e.key === 'Enter') calc(); });
            });
            btnClear.addEventListener('click', () => {
                Object.values(inputs).forEach(inp => { inp.value = ''; inp.style.color = 'var(--text-normal)'; inp.style.fontWeight = 'normal'; });
                errBox.style.display = 'none';
            });
            btnCalc.addEventListener('click', calc);

            function calc() {
                errBox.style.display = 'none';
                const v = {};
                fields.forEach(k => { const s = inputs[k].value.trim(); v[k] = s !== '' ? parseFloat(s.replace(',','.')) : null; });
                const orig = { ...v };

                for (const k of fields) { if (v[k] !== null && v[k] < 0) { showErr(`${k.toUpperCase()} darf nicht negativ sein.`); return; } }
                if (v.ri !== null && v.ri <= 0) { showErr('Ri muss > 0 sein.'); return; }
                if (Object.values(orig).filter(x => x !== null).length < 2) { showErr('Bitte mindestens 2 Werte eingeben.'); return; }

                for (let iter = 0; iter < 20; iter++) {
                    const snap = JSON.stringify(v);

                    // Isc = E / Ri
                    if (v.e  !== null && v.ri  !== null && v.ri  > 0 && v.isc === null) v.isc = v.e / v.ri;
                    if (v.isc!== null && v.ri  !== null && v.ri  > 0 && v.e   === null) v.e   = v.isc * v.ri;
                    if (v.e  !== null && v.isc !== null && v.isc > 0 && v.ri  === null) v.ri  = v.e / v.isc;

                    // Uk = I · Ra
                    if (v.i  !== null && v.ra  !== null && v.uk  === null) v.uk = v.i * v.ra;
                    if (v.uk !== null && v.ra  !== null && v.ra  > 0 && v.i   === null) v.i   = v.uk / v.ra;
                    if (v.uk !== null && v.i   !== null && v.i   > 0 && v.ra  === null) v.ra  = v.uk / v.i;

                    // E = Uk + I·Ri
                    if (v.uk !== null && v.i   !== null && v.ri  !== null && v.e   === null) v.e  = v.uk + v.i * v.ri;
                    if (v.e  !== null && v.i   !== null && v.ri  !== null && v.uk  === null) v.uk = v.e - v.i * v.ri;
                    if (v.e  !== null && v.uk  !== null && v.i   !== null && v.i   > 0 && v.ri  === null) v.ri = (v.e - v.uk) / v.i;
                    if (v.e  !== null && v.uk  !== null && v.ri  !== null && v.ri  > 0 && v.i   === null) v.i  = (v.e - v.uk) / v.ri;

                    // I = E / (Ri + Ra)
                    if (v.e !== null && v.ri !== null && v.ra !== null && v.i === null && (v.ri + v.ra) > 0)
                        v.i = v.e / (v.ri + v.ra);
                    if (v.i !== null && v.i > 0 && v.e !== null && v.ra !== null && v.ri === null) {
                        const r = v.e / v.i - v.ra; if (r > 0) v.ri = r;
                    }
                    if (v.i !== null && v.i > 0 && v.e !== null && v.ri !== null && v.ra === null) {
                        const r = v.e / v.i - v.ri; if (r >= 0) v.ra = r;
                    }

                    // Pa = I²·Ra
                    if (v.i  !== null && v.ra !== null && v.pa  === null) v.pa = v.i ** 2 * v.ra;
                    if (v.pa !== null && v.ra !== null && v.ra  > 0 && v.i  === null) v.i  = Math.sqrt(v.pa / v.ra);
                    if (v.pa !== null && v.i  !== null && v.i   > 0 && v.ra === null) v.ra = v.pa / v.i ** 2;

                    // Pa = Uk·I
                    if (v.uk !== null && v.i  !== null && v.pa  === null) v.pa = v.uk * v.i;
                    if (v.pa !== null && v.i  !== null && v.i   > 0 && v.uk === null) v.uk = v.pa / v.i;
                    if (v.pa !== null && v.uk !== null && v.uk  > 0 && v.i  === null) v.i  = v.pa / v.uk;

                    // Pa = Uk²/Ra
                    if (v.uk !== null && v.ra !== null && v.ra  > 0 && v.pa === null) v.pa = v.uk ** 2 / v.ra;
                    if (v.pa !== null && v.ra !== null && v.ra  > 0 && v.uk === null) v.uk = Math.sqrt(v.pa * v.ra);
                    if (v.pa !== null && v.uk !== null && v.pa  > 0 && v.ra === null) v.ra = v.uk ** 2 / v.pa;

                    // Pi = I²·Ri
                    if (v.i  !== null && v.ri !== null && v.pi  === null) v.pi = v.i ** 2 * v.ri;
                    if (v.pi !== null && v.ri !== null && v.ri  > 0 && v.i  === null) v.i  = Math.sqrt(v.pi / v.ri);
                    if (v.pi !== null && v.i  !== null && v.i   > 0 && v.ri === null) v.ri = v.pi / v.i ** 2;

                    // Pi = (E−Uk)·I
                    if (v.e  !== null && v.uk !== null && v.i   !== null && v.pi  === null) v.pi = (v.e - v.uk) * v.i;
                    if (v.pi !== null && v.i  !== null && v.i   > 0 && v.uk !== null && v.e  === null) v.e  = v.pi / v.i + v.uk;
                    if (v.pi !== null && v.i  !== null && v.i   > 0 && v.e  !== null && v.uk === null) v.uk = v.e - v.pi / v.i;

                    // P_ges = E·I
                    if (v.e    !== null && v.i    !== null && v.pges === null)          v.pges = v.e * v.i;
                    if (v.pges !== null && v.i    !== null && v.i   > 0 && v.e    === null) v.e    = v.pges / v.i;
                    if (v.pges !== null && v.e    !== null && v.e   > 0 && v.i    === null) v.i    = v.pges / v.e;

                    // P_ges = Pa + Pi
                    if (v.pa   !== null && v.pi   !== null && v.pges === null)          v.pges = v.pa + v.pi;
                    if (v.pges !== null && v.pa   !== null && v.pi  === null)           v.pi   = v.pges - v.pa;
                    if (v.pges !== null && v.pi   !== null && v.pa  === null)           v.pa   = v.pges - v.pi;

                    if (JSON.stringify(v) === snap) break;
                }

                const fmt = x => x === null || !isFinite(x) ? '' : parseFloat(x.toPrecision(5)).toString();
                fields.forEach(k => {
                    if (v[k] !== null && isFinite(v[k])) {
                        inputs[k].value = fmt(v[k]);
                        if (orig[k] === null) { inputs[k].style.color = '#60a5fa'; inputs[k].style.fontWeight = 'bold'; }
                    }
                });
            }
            function showErr(msg) { errBox.innerHTML = msg; errBox.style.display = 'block'; }
        }

        // Start
        init();
    </script>
</body>
