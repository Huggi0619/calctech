<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalcTech - Technischer Formelrechner</title>
    <meta name="description" content="CalcTech - Der modernste technische Formelrechner für Berufsschüler in der Schweiz. Einfache Berechnungen für Elektrotechnik, Physik und Mathematik.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-darker: #181818;
            --bg-sidebar: #252526;
            --bg-editor: #1e1e1e;
            --bg-header: #3c3c3c;
            --bg-tab-active: #1e1e1e;
            --bg-tab-inactive: #2d2d2d;
            --bg-hover: #2a2d2e;
            --text-normal: #cccccc;
            --text-muted: #858585;
            --text-active: #ffffff;
            --accent-color: #007acc;
            --border-color: #3c3c3c;
            --status-bg: #007acc;
            --status-fg: #ffffff;
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
            --mono-font: 'Fira Code', Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-editor);
            color: var(--text-normal);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            background-color: var(--bg-header);
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            font-size: 13px;
            user-select: none;
            border-bottom: 1px solid var(--border-color);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            color: var(--accent-color);
            font-weight: 700;
        }

        .header-title {
            color: var(--text-muted);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-muted);
        }

        /* Main Workspace */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        aside {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 10px 15px;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .explorer {
            flex: 1;
            overflow-y: auto;
        }

        .explorer::-webkit-scrollbar {
            width: 8px;
        }
        .explorer::-webkit-scrollbar-thumb {
            background: #424242;
        }
        .explorer::-webkit-scrollbar-thumb:hover {
            background: #4f4f4f;
        }

        /* Accordion items */
        .folder {
            user-select: none;
        }

        .folder-title {
            padding: 6px 15px;
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .folder-title:hover {
            background-color: var(--bg-hover);
        }

        .folder-icon {
            margin-right: 6px;
            font-size: 10px;
            transition: transform 0.15s ease;
            width: 15px;
            display: inline-block;
            text-align: center;
            color: var(--text-muted);
        }

        .folder.open .folder-icon {
            transform: rotate(90deg);
        }

        .folder-content {
            display: none;
            flex-direction: column;
        }

        .folder.open .folder-content {
            display: flex;
        }

        .file {
            padding: 4px 15px 4px 35px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .file:hover {
            background-color: var(--bg-hover);
        }

        .file.active {
            background-color: #37373d;
            color: var(--text-active);
        }

        .file-icon {
            margin-right: 8px;
            color: var(--accent-color);
            font-family: var(--mono-font);
            font-weight: 500;
        }

        /* Main Editor Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-editor);
            overflow: hidden;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background-color: var(--bg-sidebar);
            overflow-x: auto;
        }

        .tabs::-webkit-scrollbar {
            height: 3px;
        }
        .tabs::-webkit-scrollbar-thumb {
            background: #555;
        }

        .tab {
            padding: 8px 15px;
            background-color: var(--bg-tab-inactive);
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            border-right: 1px solid var(--bg-darker);
            border-top: 2px solid transparent;
            user-select: none;
        }

        .tab:hover {
            background-color: var(--bg-hover);
        }

        .tab.active {
            background-color: var(--bg-tab-active);
            color: var(--text-active);
            border-top: 2px solid var(--accent-color);
        }

        .tab-close {
            margin-left: 8px;
            font-size: 12px;
            padding: 2px;
            border-radius: 3px;
            opacity: 0;
            transition: opacity 0.2s, background-color 0.2s;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab:hover .tab-close, .tab.active .tab-close {
            opacity: 1;
        }

        .tab-close:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Editor Content */
        .editor-content {
            flex: 1;
            overflow-y: auto;
            position: relative;
        }

        .editor-content::-webkit-scrollbar {
            width: 12px;
        }
        .editor-content::-webkit-scrollbar-thumb {
            background: rgba(121, 121, 121, 0.4);
        }
        .editor-content::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 100, 100, 0.7);
        }

        .editor-pane {
            display: none;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }

        .editor-pane.active {
            display: block;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Placeholder Card */
        .calc-card {
            background-color: #252526;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .calc-card h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-active);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .calc-card p {
            color: var(--text-muted);
            margin-bottom: 30px;
            line-height: 1.5;
            font-size: 14px;
        }

        .mock-input-group {
            margin-bottom: 15px;
        }

        .mock-input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            color: var(--text-muted);
            font-family: var(--mono-font);
        }

        .mock-input {
            width: 100%;
            background-color: #3c3c3c;
            border: 1px solid #555;
            padding: 10px 12px;
            border-radius: 4px;
            color: var(--text-muted);
            font-family: var(--mono-font);
            outline: none;
            transition: border-color 0.2s;
        }

        .mock-input:focus {
            border-color: var(--accent-color);
        }

        .mock-button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: 500;
            cursor: not-allowed;
            opacity: 0.8;
            margin-top: 10px;
            width: 100%;
            font-size: 14px;
        }

        /* Welcome Screen */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            color: var(--text-muted);
        }

        .welcome-logo {
            font-size: 80px;
            color: #333;
            margin-bottom: 20px;
        }

        .welcome-title {
            font-size: 32px;
            font-weight: 300;
            color: var(--text-normal);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .welcome-shortcuts {
            margin-top: 40px;
            text-align: left;
        }

        .shortcut {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .shortcut-key {
            background-color: #333;
            padding: 3px 8px;
            border-radius: 3px;
            font-family: var(--mono-font);
            margin-left: 20px;
            border: 1px solid #444;
            box-shadow: 0 2px 0 #222;
        }

        /* Status Bar */
        footer {
            background-color: var(--status-bg);
            color: var(--status-fg);
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            font-size: 12px;
            font-weight: 500;
            user-select: none;
        }

        .status-left, .status-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .status-item {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 0 5px;
            height: 22px;
            transition: background-color 0.1s;
        }

        .status-item:hover {
            background-color: rgba(255,255,255,0.15);
        }

        /* Responsive */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-normal);
            font-size: 18px;
            cursor: pointer;
            padding: 0 5px;
        }

        .backdrop {
            display: none;
            position: fixed;
            top: 35px;
            left: 0;
            right: 0;
            bottom: 22px;
            background: rgba(0,0,0,0.5);
            z-index: 90;
        }

        @media (max-width: 768px) {
            .mobile-menu-btn {
                display: block;
            }
            
            aside {
                position: absolute;
                z-index: 100;
                height: calc(100vh - 57px); /* minus header and footer */
                transform: translateX(-100%);
            }
            
            aside.mobile-open {
                transform: translateX(0);
                box-shadow: 4px 0 15px rgba(0,0,0,0.5);
            }
            
            .backdrop.mobile-open {
                display: block;
            }
            
            .header-title {
                display: none;
            }

            .editor-pane {
                padding: 20px;
            }
        }

        /* ===== BAUKASTEN CIRCUIT BUILDER ===== */
        #pane-schaltungsbauer { max-width: none; padding: 0; }
        .bk-top-bar {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 18px; background: #252526;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap; font-size: 13px;
        }
        .bk-lbl { color: var(--text-muted); font-weight: 600; font-size: 12px; }
        .bk-num-inp {
            background: #3c3c3c; border: 1px solid #555;
            color: var(--text-normal); padding: 5px 8px;
            border-radius: 6px; font-family: var(--mono-font);
            font-size: 13px; outline: none;
        }
        .bk-num-inp:focus { border-color: var(--accent-color); }
        .bk-canvas-wrap {
            background: #1a1a1a; height: 400px;
            border-bottom: 1px solid var(--border-color); overflow: hidden;
        }
        #bk-canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
        .bk-formula-bar {
            padding: 7px 18px; background: #252526;
            border-bottom: 1px solid var(--border-color); font-size: 13px; min-height: 33px;
        }
        .bk-action-bar {
            display: flex; gap: 8px; padding: 10px 14px;
            background: #1e1e1e; border-bottom: 1px solid var(--border-color); flex-wrap: wrap;
        }
        .bk-btn {
            padding: 7px 16px; border: none; border-radius: 8px;
            font-size: 13px; font-weight: 600; cursor: pointer; color: #fff;
            transition: filter .15s, transform .1s;
            letter-spacing: 0.02em;
        }
        .bk-btn:hover  { filter: brightness(1.2); }
        .bk-btn:active { transform: scale(0.96); filter: brightness(0.92); }
        .bk-btn-blue   { background: #1d4ed8; }
        .bk-btn-brown  { background: #92400e; }
        .bk-btn-orange { background: #c2410c; }
        .bk-btn-purple { background: #6d28d9; }
        .bk-btn-slate  { background: #475569; }
        .bk-btn-dark   { background: #334155; }
        .bk-btn-green  { background: #059669; font-size: 14px; padding: 8px 22px; }
        .bk-btn-red    { background: #dc2626; }
        .bk-table-wrap {
            max-height: 210px; overflow-y: auto;
            border-bottom: 1px solid var(--border-color);
        }
        .bk-table-wrap::-webkit-scrollbar { width: 8px; }
        .bk-table-wrap::-webkit-scrollbar-thumb { background: #424242; }
        .bk-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .bk-table thead th {
            background: #1e293b; color: #fff; padding: 6px 8px;
            text-align: left; font-weight: 600; position: sticky; top: 0; z-index: 1;
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .bk-table th:not(:first-child), .bk-table td:not(:first-child) { min-width: 90px; }
        .bk-table td { border-bottom: 1px solid #222; }
        .bk-inp {
            width: 100%; background: transparent; border: none;
            border-bottom: 1px solid #333;
            color: var(--text-normal); padding: 5px 6px;
            font-family: var(--mono-font); font-size: 12px; outline: none;
            box-sizing: border-box; transition: border-color .15s;
        }
        .bk-inp:hover  { border-bottom-color: #555; }
        .bk-inp:focus  { border-bottom-color: var(--accent-color); background: rgba(0,122,204,.06); }
        /* Focused row — sky-blue left accent + tinted bg */
        .bk-table tbody tr.bk-row-focused td { background: #0d2a45 !important; }
        .bk-table tbody tr.bk-row-focused td:first-child {
            border-left: 3px solid #38bdf8;
            color: #38bdf8 !important; font-weight: 700 !important;
        }
        .bk-table tbody tr.bk-row-focused .bk-inp { background: rgba(56,189,248,.06); }
        .bk-bottom-bar {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 18px; background: #252526; flex-wrap: wrap;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-brand">
            <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
            <span class="header-logo">▱ CalcTech</span>
            <span class="header-title">Technischer Formelrechner</span>
        </div>
        <div class="header-controls">
            <span>🇨🇭 Edition</span>
        </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">
        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-header">Explorer</div>
            <div class="explorer" id="explorer">
                <!-- Folders are generated by JS -->
            </div>
        </aside>
        
        <div class="backdrop" id="backdrop"></div>

        <!-- Main Editor -->
        <main>
            <!-- Tabs Bar -->
            <div class="tabs" id="tabsBar">
                <!-- Tabs generated by JS -->
            </div>
            
            <!-- Content Area -->
            <div class="editor-content" id="editorContent">
                <!-- Welcome Screen -->
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-logo">▱</div>
                    <h1 class="welcome-title">CalcTech</h1>
                    <p>Technischer Formelrechner für Berufsschüler</p>
                    <div class="welcome-shortcuts">
                        <div class="shortcut">
                            <span>Wähle eine Kategorie in der Seitenleiste</span>
                            <span class="shortcut-key">Explorer</span>
                        </div>
                        <div class="shortcut">
                            <span>Formeln öffnen und berechnen</span>
                            <span class="shortcut-key">Click</span>
                        </div>
                    </div>
                </div>
                <!-- Dynamic Panes generated by JS -->
            </div>
        </main>
    </div>

    <!-- Status Bar -->
    <footer>
        <div class="status-left">
            <span class="status-item">⚡ Bereit</span>
            <span class="status-item">0 Fehler, 0 Warnungen</span>
        </div>
        <div class="status-right">
            <span class="status-item" title="Präzision (Stellen)">4 Stellen</span>
            <span class="status-item">UTF-8</span>
            <span class="status-item">HTML/JS</span>
        </div>
    </footer>

    <script>
        // Data Structure matching the desktop app conceptually
        const categories = [
            {
                id: 'elektrotechnik',
                name: 'Elektrotechnik',
                open: true,
                items: [
                    { id: 'ohmsches-gesetz', name: 'Ohmsches Gesetz', icon: 'Ω', desc: 'Berechnung von Spannung (U), Strom (I), Widerstand (R) und Leistung (P).' },
                    { id: 'leistung', name: 'Leistung', icon: 'W', desc: 'Berechnung der elektrischen Leistung (P).' },
                    { id: 'widerstand', name: 'Widerstand', icon: 'R', desc: 'Reihen- und Parallelschaltung, Farbcode, Innenwiderstand.' },
                    { id: 'schaltungsbauer', name: 'Schaltungsbauer', icon: '⊟', desc: 'Widerstände visuell kombinieren — Reihe und Parallel — und U/I/R/P bidirektional berechnen.' }
                ]
            },
            {
                id: 'physik',
                name: 'Physik',
                open: false,
                items: [
                    { id: 'mechanik', name: 'Mechanik', icon: 'F', desc: 'Geschwindigkeit, Beschleunigung, Kraft und Hebelgesetz.' },
                    { id: 'energie', name: 'Energie', icon: 'E', desc: 'Potentielle, kinetische Energie und Arbeit.' },
                    { id: 'thermodynamik', name: 'Thermodynamik', icon: 'T', desc: 'Wärmemenge, Temperaturumrechnung und Ausdehnung.' }
                ]
            },
            {
                id: 'mathematik',
                name: 'Mathematik',
                open: false,
                items: [
                    { id: 'trigonometrie', name: 'Trigonometrie', icon: 'θ', desc: 'Sinus, Cosinus, Tangens am rechtwinkligen Dreieck.' },
                    { id: 'geometrie', name: 'Geometrie', icon: '△', desc: 'Flächen- und Volumenberechnung diverser Körper.' }
                ]
            },
            {
                id: 'eigene-formeln',
                name: 'Eigene Formeln',
                open: false,
                items: []
            }
        ];

        // State
        let openTabs = [];
        let activeTabId = null;

        // DOM Elements
        const explorerEl = document.getElementById('explorer');
        const tabsBarEl = document.getElementById('tabsBar');
        const editorContentEl = document.getElementById('editorContent');
        const welcomeScreenEl = document.getElementById('welcomeScreen');
        const sidebarEl = document.getElementById('sidebar');
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const backdropEl = document.getElementById('backdrop');

        // Initialize UI
        function init() {
            renderSidebar();
            
            // Mobile Menu Toggle
            mobileMenuBtn.addEventListener('click', toggleMobileMenu);
            backdropEl.addEventListener('click', toggleMobileMenu);
        }
        
        function toggleMobileMenu() {
            sidebarEl.classList.toggle('mobile-open');
            backdropEl.classList.toggle('mobile-open');
        }

        // Render Sidebar
        function renderSidebar() {
            explorerEl.innerHTML = '';
            
            categories.forEach(folder => {
                const folderEl = document.createElement('div');
                folderEl.className = `folder ${folder.open ? 'open' : ''}`;
                
                // Folder Title
                const titleEl = document.createElement('div');
                titleEl.className = 'folder-title';
                titleEl.innerHTML = `<span class="folder-icon">▶</span> ${folder.name}`;
                titleEl.addEventListener('click', () => {
                    folder.open = !folder.open;
                    folderEl.classList.toggle('open');
                });
                
                // Folder Content (Files)
                const contentEl = document.createElement('div');
                contentEl.className = 'folder-content';
                
                if (folder.items.length === 0) {
                    const emptyEl = document.createElement('div');
                    emptyEl.className = 'file';
                    emptyEl.style.color = 'var(--text-muted)';
                    emptyEl.style.fontStyle = 'italic';
                    emptyEl.textContent = 'Leer';
                    contentEl.appendChild(emptyEl);
                } else {
                    folder.items.forEach(item => {
                        const fileEl = document.createElement('div');
                        fileEl.className = 'file';
                        fileEl.id = `file-${item.id}`;
                        fileEl.innerHTML = `<span class="file-icon">${item.icon}</span> ${item.name}`;
                        
                        fileEl.addEventListener('click', () => {
                            openTab(item);
                            // Close mobile menu if open
                            if(window.innerWidth <= 768) {
                                toggleMobileMenu();
                            }
                        });
                        
                        contentEl.appendChild(fileEl);
                    });
                }
                
                folderEl.appendChild(titleEl);
                folderEl.appendChild(contentEl);
                explorerEl.appendChild(folderEl);
            });
            
            updateSidebarHighlight();
        }

        // Tab Management
        function openTab(item) {
            if (!openTabs.find(t => t.id === item.id)) {
                openTabs.push(item);
                createPane(item);
            }
            setActiveTab(item.id);
        }

        function closeTab(e, id) {
            e.stopPropagation(); // Prevent tab click event
            
            const index = openTabs.findIndex(t => t.id === id);
            if (index > -1) {
                openTabs.splice(index, 1);
                
                // Remove pane
                const pane = document.getElementById(`pane-${id}`);
                if(pane) pane.remove();
                
                // Determine new active tab
                if (activeTabId === id) {
                    if (openTabs.length > 0) {
                        // Switch to the previous tab or the first one
                        const newActive = openTabs[index - 1] || openTabs[0];
                        setActiveTab(newActive.id);
                    } else {
                        setActiveTab(null);
                    }
                } else {
                    renderTabs();
                }
            }
        }

        function setActiveTab(id) {
            activeTabId = id;
            renderTabs();
            updateSidebarHighlight();
            updatePanes();
        }

        // Render Tabs Bar
        function renderTabs() {
            tabsBarEl.innerHTML = '';
            
            openTabs.forEach(item => {
                const tabEl = document.createElement('div');
                tabEl.className = `tab ${item.id === activeTabId ? 'active' : ''}`;
                
                tabEl.innerHTML = `
                    <span class="file-icon" style="margin-right:6px; font-size:12px;">${item.icon}</span> 
                    ${item.name}
                    <span class="tab-close">✕</span>
                `;
                
                tabEl.addEventListener('click', () => setActiveTab(item.id));
                
                const closeBtn = tabEl.querySelector('.tab-close');

        // Ohm's Law Calculator Logic
        function initOhmCalculator() {
            const inputs = {
                U: document.getElementById('ohm-u'),
                I: document.getElementById('ohm-i'),
                R: document.getElementById('ohm-r'),
                P: document.getElementById('ohm-p')
            };
            const btnCalc = document.getElementById('ohm-calc-btn');
            const btnClear = document.getElementById('ohm-clear-btn');
            const errBox = document.getElementById('ohm-error-box');

            // Reset formatting when user edits a field manually
            Object.values(inputs).forEach(input => {
                input.addEventListener('input', () => {
                    input.style.color = 'var(--text-normal)';
                    input.style.fontWeight = 'normal';
                    errBox.style.display = 'none';
                });
                // Auto-calculate on Enter key
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') calculateOhm();
                });
            });

            btnClear.addEventListener('click', () => {
                Object.values(inputs).forEach(input => {
                    input.value = '';
                    input.style.color = 'var(--text-normal)';
                    input.style.fontWeight = 'normal';
                });
                errBox.style.display = 'none';
            });

            btnCalc.addEventListener('click', calculateOhm);

            function calculateOhm() {
                errBox.style.display = 'none';
                
                let v = {
                    U: inputs.U.value.trim() !== '' ? parseFloat(inputs.U.value.replace(',', '.')) : null,
                    I: inputs.I.value.trim() !== '' ? parseFloat(inputs.I.value.replace(',', '.')) : null,
                    R: inputs.R.value.trim() !== '' ? parseFloat(inputs.R.value.replace(',', '.')) : null,
                    P: inputs.P.value.trim() !== '' ? parseFloat(inputs.P.value.replace(',', '.')) : null
                };
                
                let original = { U: v.U, I: v.I, R: v.R, P: v.P };
                let errors = [];

                if (v.R !== null && v.R <= 0) errors.push("Widerstand R muss > 0 sein.");
                if (v.U !== null && v.U < 0) errors.push("Spannung U darf nicht negativ sein.");
                if (v.I !== null && v.I < 0) errors.push("Strom I darf nicht negativ sein.");
                if (v.P !== null && v.P < 0) errors.push("Leistung P darf nicht negativ sein.");

                if (errors.length > 0) {
                    showError(errors.join('<br>'));
                    return;
                }

                let enteredCount = Object.values(original).filter(val => val !== null).length;
                if (enteredCount < 2) {
                    showError("Bitte mindestens 2 Werte eingeben.");
                    return;
                }

                // Fixed-point iteration for calculating missing values
                for(let iter=0; iter<3; iter++) {
                    let prev = JSON.stringify(v);
                    
                    if (v.R !== null && v.I !== null && v.U === null) v.U = v.R * v.I;
                    if (v.U !== null && v.R !== null && v.I === null && v.R !== 0) v.I = v.U / v.R;
                    if (v.U !== null && v.I !== null && v.R === null && v.I !== 0) v.R = v.U / v.I;
                    
                    if (v.U !== null && v.I !== null && v.P === null) v.P = v.U * v.I;
                    if (v.U !== null && v.R !== null && v.P === null && v.R !== 0) v.P = Math.pow(v.U, 2) / v.R;
                    if (v.I !== null && v.R !== null && v.P === null) v.P = Math.pow(v.I, 2) * v.R;
                    
                    if (v.P !== null && v.U !== null && v.I === null && v.U !== 0) v.I = v.P / v.U;
                    if (v.P !== null && v.I !== null && v.U === null && v.I !== 0) v.U = v.P / v.I;
                    
                    if (v.P !== null && v.I !== null && v.R === null && v.I !== 0) v.R = v.P / Math.pow(v.I, 2);
                    if (v.U !== null && v.P !== null && v.R === null && v.P !== 0) v.R = Math.pow(v.U, 2) / v.P;
                    
                    if (v.P !== null && v.R !== null && v.P >= 0 && v.R > 0) {
                        if (v.I === null) v.I = Math.sqrt(v.P / v.R);
                        if (v.U === null) v.U = Math.sqrt(v.P * v.R);
                    }
                    if(prev === JSON.stringify(v)) break;
                }

                // Consistency Check
                let tol = 1e-3;
                if (v.U !== null && v.I !== null && v.R !== null && v.R !== 0) {
                    let expected_u = v.R * v.I;
                    if (Math.abs(expected_u - v.U) / Math.max(Math.abs(v.U), 1e-12) > tol) {
                        errors.push(`Widerspruch: U=${parseFloat(v.U.toPrecision(4))}V ≠ R·I=${parseFloat(expected_u.toPrecision(4))}V`);
                    }
                }
                if (v.U !== null && v.I !== null && v.P !== null) {
                    let expected_p = v.U * v.I;
                    if (Math.abs(expected_p - v.P) / Math.max(Math.abs(v.P), 1e-12) > tol) {
                        errors.push(`Widerspruch: P=${parseFloat(v.P.toPrecision(4))}W ≠ U·I=${parseFloat(expected_p.toPrecision(4))}W`);
                    }
                }

                if (errors.length > 0) {
                    showError(errors.join('<br>'));
                    // We can still display the values to show the user what was computed
                }

                const formatVal = (val) => {
                    if(val === null || isNaN(val)) return '';
                    let s = val.toPrecision(5);
                    return parseFloat(s).toString();
                };

                for (let key in v) {
                    if (v[key] !== null && !isNaN(v[key])) {
                        inputs[key].value = formatVal(v[key]);
                        // Mark newly calculated values as blue
                        if (original[key] === null) {
                            inputs[key].style.color = '#60a5fa'; // High visibility blue
                            inputs[key].style.fontWeight = 'bold';
                        }
                    }
                }
            }

            function showError(msg) {
                errBox.innerHTML = msg;
                errBox.style.display = 'block';
            }
        }

        // Show active pane, hide others
        function updatePanes() {
            // Manage Welcome Screen
            if (openTabs.length === 0) {
                welcomeScreenEl.style.display = 'flex';
            } else {
                welcomeScreenEl.style.display = 'none';
            }
            
            // Manage Panes
            document.querySelectorAll('.editor-pane').forEach(el => {
                if (el.id === `pane-${activeTabId}`) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        // ========== BAUKASTEN CIRCUIT BUILDER ==========

        const BK_RW = 82, BK_RH = 48, BK_PAD = 14, BK_WIRE = 20, BK_RAIL = 14;
        const BK_MAX_ITER = 100;

        let _bkIdCtr = 0;
        let bkNodes = [], bkLeafNodes = [], bkSelected = new Set();
        let bkHistory = [];
        let bkTableRows = new Map();   // CircuitNode -> {U,I,R,P: HTMLInputElement}
        let bkGesamtEntries = {};
        let bkInputsSnap = new Map();  // CircuitNode -> {U,I,R,P: value|null}
        let bkHitRects = [];           // [{x1,y1,x2,y2,topNode,leafNode}]
        let bkFocusedLeaf = null;      // leaf CircuitNode whose table row is highlighted
        let bkNodeRowMap = new Map();  // CircuitNode -> HTMLTableRowElement

        class CircuitNode {
            constructor(type, label = '', rVal = null) {
                this.__id = _bkIdCtr++;
                this.type = type;
                this.label = label;
                this.rVal = rVal;
                this.children = [];
                this.vals = { U: null, I: null, R: null, P: null };
            }
            formula() {
                if (this.type === 'R') return this.label;
                const op = this.type === 'series' ? ' + ' : ' ∥ ';
                const inner = this.children.map(c => c.formula()).join(op);
                return this.children.length > 1 ? `(${inner})` : inner;
            }
        }

        // --- Measure ---
        function bkMeasure(node) {
            if (node.type === 'R') return [BK_RW, BK_RH];
            const cs = node.children.map(c => bkMeasure(c));
            if (node.type === 'series') {
                const w = cs.reduce((s, [cw]) => s + cw, 0) + BK_WIRE * (cs.length - 1) + 2 * BK_PAD;
                const h = Math.max(...cs.map(([, ch]) => ch)) + 2 * BK_PAD;
                return [w, h];
            } else {
                const w = Math.max(...cs.map(([cw]) => cw)) + 2 * BK_RAIL + 2 * BK_PAD;
                const h = cs.reduce((s, [, ch]) => s + ch, 0) + BK_WIRE * (cs.length - 1) + 2 * BK_PAD;
                return [w, h];
            }
        }

        // --- Draw ---
        const BK_DEPTH_BG = ['#1e1e1e', '#202428', '#1e2020', '#201e22', '#1e2022'];
        function bkDrawNode(ctx, node, left, midY, sel, hits, depth, topNode) {
            const [w, h] = bkMeasure(node);
            const top = midY - Math.floor(h / 2);
            const isSelected = sel.has(topNode);

            if (node.type === 'R') {
                const isFocused = node === bkFocusedLeaf;
                // Fill
                if (isSelected) ctx.fillStyle = '#0c2a4a';
                else if (isFocused) ctx.fillStyle = '#071e36';
                else ctx.fillStyle = '#252526';
                ctx.fillRect(left, top, w, h);
                // Border — focused beats selected in color (cyan > blue)
                if (isFocused) {
                    ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2.5;
                } else if (isSelected) {
                    ctx.strokeStyle = '#007acc'; ctx.lineWidth = 3;
                } else {
                    ctx.strokeStyle = '#555'; ctx.lineWidth = 1;
                }
                ctx.setLineDash([]);
                ctx.strokeRect(left, top, w, h);
                // Small accent dot bottom-left when focused
                if (isFocused) {
                    ctx.fillStyle = '#38bdf8';
                    ctx.beginPath(); ctx.arc(left + 7, top + h - 7, 3, 0, Math.PI * 2); ctx.fill();
                }
                // Label
                ctx.fillStyle = isFocused ? '#bae6fd' : '#e2e8f0';
                ctx.font = 'bold 11px Inter, system-ui, sans-serif';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(node.label, left + w / 2, midY - 9);
                // R value
                const rv = node.rVal !== null ? `${parseFloat(node.rVal.toPrecision(4))} Ω` : '? Ω';
                ctx.fillStyle = isFocused ? '#7dd3fc' : '#858585';
                ctx.font = '10px Inter, system-ui, sans-serif';
                ctx.fillText(rv, left + w / 2, midY + 9);
                hits.push({ x1: left, y1: top, x2: left + w, y2: top + h, topNode, leafNode: node });
                return;
            }

            ctx.fillStyle = BK_DEPTH_BG[depth % BK_DEPTH_BG.length];
            ctx.fillRect(left, top, w, h);
            ctx.strokeStyle = isSelected ? '#007acc' : '#3c3c3c';
            ctx.lineWidth = isSelected ? 2 : 1;
            ctx.setLineDash(isSelected ? [] : [5, 3]);
            ctx.strokeRect(left, top, w, h);
            ctx.setLineDash([]);

            if (node.type === 'series') {
                let cx = left + BK_PAD;
                for (let i = 0; i < node.children.length; i++) {
                    const [cw] = bkMeasure(node.children[i]);
                    if (i > 0) {
                        ctx.beginPath(); ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2;
                        ctx.moveTo(cx, midY); ctx.lineTo(cx + BK_WIRE, midY); ctx.stroke();
                        cx += BK_WIRE;
                    }
                    bkDrawNode(ctx, node.children[i], cx, midY, sel, hits, depth + 1, topNode);
                    cx += cw;
                }
            } else {
                const innerW = Math.max(...node.children.map(c => bkMeasure(c)[0]));
                const railL = left + BK_PAD, railR = left + w - BK_PAD;
                const mids = [];
                let curY = top + BK_PAD;
                for (const ch of node.children) {
                    const [, ch_h] = bkMeasure(ch);
                    mids.push(curY + Math.floor(ch_h / 2));
                    curY += ch_h + BK_WIRE;
                }
                ctx.beginPath(); ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2;
                ctx.moveTo(railL, mids[0]); ctx.lineTo(railL, mids[mids.length - 1]); ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(railR, mids[0]); ctx.lineTo(railR, mids[mids.length - 1]); ctx.stroke();
                for (let i = 0; i < node.children.length; i++) {
                    const [cw] = bkMeasure(node.children[i]);
                    const cl = left + BK_PAD + BK_RAIL + Math.floor((innerW - cw) / 2);
                    bkDrawNode(ctx, node.children[i], cl, mids[i], sel, hits, depth + 1, topNode);
                    ctx.beginPath(); ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2;
                    ctx.moveTo(railL, mids[i]); ctx.lineTo(cl, mids[i]); ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(cl + cw, mids[i]); ctx.lineTo(railR, mids[i]); ctx.stroke();
                }
            }
        }

        // --- Solver ---
        function bkApplyOhm(v) {
            if (v.R !== null && v.I !== null && v.U === null) v.U = v.R * v.I;
            if (v.U !== null && v.R !== null && v.I === null && v.R !== 0) v.I = v.U / v.R;
            if (v.U !== null && v.I !== null && v.R === null && v.I !== 0) v.R = v.U / v.I;
            if (v.U !== null && v.I !== null && v.P === null) v.P = v.U * v.I;
            if (v.U !== null && v.R !== null && v.P === null && v.R !== 0) v.P = v.U ** 2 / v.R;
            if (v.I !== null && v.R !== null && v.P === null) v.P = v.I ** 2 * v.R;
            if (v.P !== null && v.U !== null && v.I === null && v.U !== 0) v.I = v.P / v.U;
            if (v.P !== null && v.I !== null && v.U === null && v.I !== 0) v.U = v.P / v.I;
            if (v.P !== null && v.I !== null && v.R === null && v.I !== 0) v.R = v.P / v.I ** 2;
            if (v.U !== null && v.P !== null && v.R === null && v.P !== 0) v.R = v.U ** 2 / v.P;
            if (v.P !== null && v.R !== null && v.P >= 0 && v.R > 0) {
                if (v.I === null) v.I = Math.sqrt(v.P / v.R);
                if (v.U === null) v.U = Math.sqrt(v.P * v.R);
            }
        }

        function bkOhmAll(node) {
            bkApplyOhm(node.vals);
            for (const c of node.children) bkOhmAll(c);
        }

        function _bkSumKn(arr) { return arr.filter(x => x !== null).reduce((a, b) => a + b, 0); }
        function _bkCntNull(arr) { return arr.filter(x => x === null).length; }
        function _bkIdxNull(arr) { return arr.indexOf(null); }

        function bkUp(node) {
            if (node.type === 'R') return;
            for (const c of node.children) bkUp(c);
            const v = node.vals;
            const cv = node.children.map(c => c.vals);
            if (node.type === 'series') {
                const rL = cv.map(x => x.R);
                if (v.R === null && _bkCntNull(rL) === 0) v.R = _bkSumKn(rL);
                else if (v.R !== null && _bkCntNull(rL) === 1) cv[_bkIdxNull(rL)].R = Math.max(0, v.R - _bkSumKn(rL));
                const uL = cv.map(x => x.U);
                if (v.U === null && _bkCntNull(uL) === 0) v.U = _bkSumKn(uL);
                else if (v.U !== null && _bkCntNull(uL) === 1) cv[_bkIdxNull(uL)].U = Math.max(0, v.U - _bkSumKn(uL));
                const iV = cv.map(x => x.I).filter(i => i !== null);
                if (v.I === null && iV.length > 0) v.I = iV[0];
                const pL = cv.map(x => x.P);
                if (v.P === null && _bkCntNull(pL) === 0) v.P = _bkSumKn(pL);
                else if (v.P !== null && _bkCntNull(pL) === 1) cv[_bkIdxNull(pL)].P = Math.max(0, v.P - _bkSumKn(pL));
            } else {
                const rL = cv.map(x => x.R);
                if (v.R === null && _bkCntNull(rL) === 0 && rL.every(r => r > 0))
                    v.R = 1 / rL.reduce((s, r) => s + 1 / r, 0);
                else if (v.R !== null && v.R > 0 && _bkCntNull(rL) === 1) {
                    const mi = _bkIdxNull(rL);
                    const kInv = rL.filter(r => r !== null && r > 0).reduce((s, r) => s + 1 / r, 0);
                    const diff = 1 / v.R - kInv;
                    if (diff > Math.abs(1 / v.R) * 1e-9 + 1e-15) cv[mi].R = 1 / diff;
                }
                const uV = cv.map(x => x.U).filter(u => u !== null);
                if (v.U === null && uV.length > 0) v.U = uV[0];
                const iL = cv.map(x => x.I);
                if (v.I === null && _bkCntNull(iL) === 0) v.I = _bkSumKn(iL);
                else if (v.I !== null && _bkCntNull(iL) === 1) cv[_bkIdxNull(iL)].I = Math.max(0, v.I - _bkSumKn(iL));
                const pL = cv.map(x => x.P);
                if (v.P === null && _bkCntNull(pL) === 0) v.P = _bkSumKn(pL);
                else if (v.P !== null && _bkCntNull(pL) === 1) cv[_bkIdxNull(pL)].P = Math.max(0, v.P - _bkSumKn(pL));
            }
        }

        function bkDown(node) {
            if (node.type === 'R') return;
            const v = node.vals;
            const cv = node.children.map(c => c.vals);
            if (node.type === 'series') {
                if (v.I !== null) for (const c of node.children) { if (c.vals.I === null) c.vals.I = v.I; }
                const uL = cv.map(x => x.U);
                if (v.U !== null && _bkCntNull(uL) === 1) cv[_bkIdxNull(uL)].U = Math.max(0, v.U - _bkSumKn(uL));
                const rL = cv.map(x => x.R);
                if (v.R !== null && _bkCntNull(rL) === 1) cv[_bkIdxNull(rL)].R = Math.max(0, v.R - _bkSumKn(rL));
                const pL = cv.map(x => x.P);
                if (v.P !== null && _bkCntNull(pL) === 1) cv[_bkIdxNull(pL)].P = Math.max(0, v.P - _bkSumKn(pL));
            } else {
                if (v.U !== null) for (const c of node.children) { if (c.vals.U === null) c.vals.U = v.U; }
                const iL = cv.map(x => x.I);
                if (v.I !== null && _bkCntNull(iL) === 1) cv[_bkIdxNull(iL)].I = Math.max(0, v.I - _bkSumKn(iL));
                const rL = cv.map(x => x.R);
                if (v.R !== null && v.R > 0 && _bkCntNull(rL) === 1) {
                    const mi = _bkIdxNull(rL);
                    const kInv = rL.filter(r => r !== null && r > 0).reduce((s, r) => s + 1 / r, 0);
                    const diff = 1 / v.R - kInv;
                    if (diff > Math.abs(1 / v.R) * 1e-9 + 1e-15) cv[mi].R = 1 / diff;
                }
                const pL = cv.map(x => x.P);
                if (v.P === null && _bkCntNull(pL) === 0) v.P = _bkSumKn(pL);
                else if (v.P !== null && _bkCntNull(pL) === 1) cv[_bkIdxNull(pL)].P = Math.max(0, v.P - _bkSumKn(pL));
            }
            for (const c of node.children) bkDown(c);
        }

        function bkSnapVals(node) {
            const p = [`${node.__id}:${JSON.stringify(node.vals)}`];
            for (const c of node.children) p.push(bkSnapVals(c));
            return p.join('|');
        }

        function solveBaukasten(root) {
            for (let i = 0; i < BK_MAX_ITER; i++) {
                const prev = bkSnapVals(root);
                bkOhmAll(root); bkUp(root); bkOhmAll(root); bkDown(root); bkOhmAll(root);
                if (bkSnapVals(root) === prev) break;
            }
        }

        // --- Node serialization for undo ---
        function bkSerNode(n) {
            return n.type === 'R' ? n : { type: n.type, ch: n.children.map(c => bkSerNode(c)) };
        }
        function bkDeserNode(s) {
            if (s instanceof CircuitNode) return s;
            const n = new CircuitNode(s.type);
            n.children = s.ch.map(c => bkDeserNode(c));
            return n;
        }
        function bkCollectLeaves(nodes) {
            const res = [];
            const col = n => { n.type === 'R' ? res.push(n) : n.children.forEach(col); };
            nodes.forEach(col);
            return res;
        }

        // --- Value parsing / formatting ---
        function bkParseVal(str) {
            if (!str) return null;
            str = str.replace(',', '.').trim();
            if (!str) return null;
            const low = str.toLowerCase();
            if (low.endsWith('meg')) return parseFloat(str) * 1e6;
            if (/[Tt]$/.test(str)) return parseFloat(str) * 1e12;
            if (/[Gg]$/.test(str)) return parseFloat(str) * 1e9;
            if (low.endsWith('k'))  return parseFloat(str) * 1e3;
            if (/M$/.test(str))    return parseFloat(str) * 1e6;
            if (/m$/.test(str))    return parseFloat(str) * 1e-3;
            if (str.endsWith('μ') || low.endsWith('u')) return parseFloat(str) * 1e-6;
            if (low.endsWith('n')) return parseFloat(str) * 1e-9;
            if (low.endsWith('p')) return parseFloat(str) * 1e-12;
            const v = parseFloat(str);
            return isNaN(v) ? null : v;
        }
        function bkReadEntry(el) { return el ? bkParseVal(el.value.trim()) : null; }
        function bkFmtVal(val, sf = 4) {
            if (val === null || !isFinite(val)) return '';
            return parseFloat(val.toPrecision(sf)).toString();
        }

        // --- Redraw canvas ---
        function bkRedraw() {
            const canvas = document.getElementById('bk-canvas');
            if (!canvas) return;
            canvas.width  = canvas.parentElement.clientWidth  || 600;
            canvas.height = canvas.parentElement.clientHeight || 230;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1e1e1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            bkHitRects = [];
            const formulaEl = document.getElementById('bk-formula');
            if (!bkNodes.length) {
                ctx.fillStyle = '#555'; ctx.font = '13px Inter, system-ui, sans-serif';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText("Klicke auf '↺ Neu erstellen'", canvas.width / 2, canvas.height / 2);
                if (formulaEl) formulaEl.textContent = '—';
                return;
            }
            const W = canvas.width, H = canvas.height, GAP = 28;
            const sizes = bkNodes.map(n => bkMeasure(n));
            const totalW = sizes.reduce((s, [w]) => s + w, 0) + GAP * (bkNodes.length - 1);
            let x = Math.max(20, Math.floor((W - totalW) / 2));
            const midY = Math.floor(H / 2);
            for (const node of bkNodes) {
                const [w] = bkMeasure(node);
                bkDrawNode(ctx, node, x, midY, bkSelected, bkHitRects, 0, node);
                x += w + GAP;
            }
            if (formulaEl) {
                formulaEl.textContent = bkNodes.length === 1
                    ? bkNodes[0].formula()
                    : bkNodes.map(n => n.formula()).join('  ,  ') + '   ← verbinden!';
            }
        }

        // --- Build table ---
        function bkBuildTable() {
            const tbody = document.getElementById('bk-table-body');
            if (!tbody) return;
            tbody.innerHTML = '';
            bkTableRows = new Map();
            bkGesamtEntries = {};
            bkNodeRowMap = new Map();

            function mkInp(bg) {
                const inp = document.createElement('input');
                inp.type = 'text'; inp.className = 'bk-inp';
                inp.style.background = bg;
                inp.addEventListener('keydown', e => { if (e.key === 'Enter') bkCalculate(); });
                inp.addEventListener('input', () => { inp.style.color = 'var(--text-normal)'; inp.style.fontWeight = 'normal'; });
                return inp;
            }
            function mkRow(label, bg, bold, node) {
                const tr = document.createElement('tr');
                const tdL = document.createElement('td');
                tdL.textContent = label;
                tdL.style.cssText = `background:${bg};padding:5px 10px;font-size:12px;font-weight:${bold?'600':'normal'};color:${bold?'var(--text-active)':'var(--text-normal)'};white-space:nowrap;`;
                tr.appendChild(tdL);
                const ents = {};
                for (const k of ['U','I','R','P']) {
                    const td = document.createElement('td');
                    td.style.cssText = `padding:2px 3px;background:${bg};`;
                    const inp = mkInp(bg);
                    td.appendChild(inp); tr.appendChild(td); ents[k] = inp;
                }
                tbody.appendChild(tr);
                if (node) bkNodeRowMap.set(node, tr);
                return ents;
            }

            bkGesamtEntries = mkRow('Gesamt', '#2a2d2e', true, null);
            for (let i = 0; i < bkLeafNodes.length; i++) {
                const node = bkLeafNodes[i];
                const bg = i % 2 === 0 ? '#1e1e1e' : '#252526';
                bkTableRows.set(node, mkRow(node.label, bg, false, node));
            }
        }

        // --- Reset ---
        function bkReset() {
            const cEl = document.getElementById('bk-count');
            const rEl = document.getElementById('bk-rval');
            let n = parseInt(cEl ? cEl.value : '5', 10);
            if (isNaN(n) || n < 1) n = 1; if (n > 15) n = 15;
            let r = parseFloat((rEl ? rEl.value : '100').replace(',', '.'));
            if (isNaN(r)) r = null;
            bkHistory = [];
            bkFocusedLeaf = null;
            bkLeafNodes = Array.from({length: n}, (_, i) => {
                const nd = new CircuitNode('R', `R${i+1}`, r);
                if (r !== null) nd.vals.R = r;
                return nd;
            });
            bkNodes = [...bkLeafNodes];
            bkSelected = new Set();
            bkBuildTable();
            if (r !== null) {
                for (const nd of bkLeafNodes) {
                    const ents = bkTableRows.get(nd);
                    if (ents) ents.R.value = String(Number.isInteger(r) ? r : r);
                }
            }
            const resEl = document.getElementById('bk-result');
            if (resEl) resEl.textContent = 'Ersatzwiderstand: —';
            bkRedraw();
        }

        // --- Set R value ---
        function bkSetRval() {
            const rEl = document.getElementById('bk-rval');
            const r = parseFloat((rEl ? rEl.value : '').replace(',', '.'));
            if (isNaN(r)) { alert('Ungültiger R-Wert.'); return; }
            const targets = bkSelected.size > 0 ? bkLeafNodes.filter(n => bkSelected.has(n)) : bkLeafNodes;
            for (const nd of targets) {
                nd.rVal = r;
                const ents = bkTableRows.get(nd);
                if (ents) { ents.R.value = String(r); ents.R.style.color = 'var(--text-normal)'; }
            }
            bkRedraw();
        }

        // --- History ---
        function bkPushHistory() {
            const entState = new Map();
            for (const [nd, ents] of bkTableRows)
                entState.set(nd, {U:ents.U.value, I:ents.I.value, R:ents.R.value, P:ents.P.value});
            bkHistory.push({
                ser: bkNodes.map(n => bkSerNode(n)),
                entState,
                gest: {U:bkGesamtEntries.U?.value||'', I:bkGesamtEntries.I?.value||'',
                       R:bkGesamtEntries.R?.value||'', P:bkGesamtEntries.P?.value||''}
            });
        }

        // --- Combine ---
        function bkCombine(mode) {
            if (bkSelected.size < 2) { alert('Mindestens 2 Elemente auswählen.'); return; }
            bkPushHistory();
            const ordered = bkNodes.filter(n => bkSelected.has(n));
            const newNode = new CircuitNode(mode);
            for (const ch of ordered) {
                if (ch.type === mode) newNode.children.push(...ch.children);
                else newNode.children.push(ch);
            }
            const newList = []; let inserted = false;
            for (const n of bkNodes) {
                if (bkSelected.has(n)) { if (!inserted) { newList.push(newNode); inserted = true; } }
                else newList.push(n);
            }
            bkNodes = newList; bkSelected = new Set([newNode]); bkRedraw();
        }

        // --- Dissolve ---
        function bkDissolve() {
            const groups = [...bkSelected].filter(n => n.type !== 'R');
            if (!groups.length) { alert('Kein kombiniertes Element gewählt.'); return; }
            bkPushHistory();
            const newList = [];
            for (const n of bkNodes) groups.includes(n) ? newList.push(...n.children) : newList.push(n);
            bkNodes = newList; bkSelected = new Set(); bkRedraw();
        }

        // --- Select all ---
        function bkSelectAll() { bkSelected = new Set(bkNodes); bkRedraw(); }

        // --- Highlight table row matching focused leaf ---
        function bkHighlightTableRow() {
            document.querySelectorAll('#bk-table-body tr').forEach(tr => tr.classList.remove('bk-row-focused'));
            if (!bkFocusedLeaf) return;
            const rowEl = bkNodeRowMap.get(bkFocusedLeaf);
            if (rowEl) {
                rowEl.classList.add('bk-row-focused');
                rowEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        // --- Undo ---
        function bkUndo() {
            if (!bkHistory.length) return;
            const { ser, entState, gest } = bkHistory.pop();
            bkNodes = ser.map(s => bkDeserNode(s));
            bkLeafNodes = bkCollectLeaves(bkNodes);
            bkSelected = new Set();
            bkBuildTable();
            for (const [nd, vals] of entState) {
                const ents = bkTableRows.get(nd);
                if (ents) for (const k of ['U','I','R','P']) ents[k].value = vals[k];
            }
            for (const k of ['U','I','R','P']) { if (bkGesamtEntries[k]) bkGesamtEntries[k].value = gest[k]; }
            bkRedraw();
        }

        // --- Canvas click ---
        function bkOnClick(e) {
            const canvas = document.getElementById('bk-canvas');
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left, my = e.clientY - rect.top;
            const ctrl = e.ctrlKey || e.metaKey;
            let clicked = null, clickedLeaf = null;
            for (let i = bkHitRects.length - 1; i >= 0; i--) {
                const hr = bkHitRects[i];
                if (mx >= hr.x1 && mx <= hr.x2 && my >= hr.y1 && my <= hr.y2) {
                    clicked = hr.topNode; clickedLeaf = hr.leafNode; break;
                }
            }
            if (clicked === null) {
                if (!ctrl) bkSelected = new Set();
                bkFocusedLeaf = null;
            } else if (ctrl) {
                bkSelected.has(clicked) ? bkSelected.delete(clicked) : bkSelected.add(clicked);
                // ctrl+click: don't change focused leaf, only toggle selection
            } else {
                bkSelected = new Set([clicked]);
                bkFocusedLeaf = clickedLeaf; // single click → focus the leaf
            }
            bkHighlightTableRow();
            bkRedraw();
        }

        // --- Calculate ---
        function bkCalculate() {
            if (bkNodes.length !== 1) { alert('Alle Elemente müssen verbunden sein (1 Gesamtknoten).'); return; }
            const root = bkNodes[0];
            const CALC_BLUE = '#60a5fa';

            // Clear calculated (blue) values from UI
            const isBlue = el => el.style.color === CALC_BLUE || el.style.color === 'rgb(96, 165, 250)';
            for (const [, ents] of bkTableRows)
                for (const k of ['U','I','R','P'])
                    if (isBlue(ents[k])) { ents[k].value = ''; ents[k].style.color = 'var(--text-normal)'; ents[k].style.fontWeight = 'normal'; }
            for (const k of ['U','I','R','P']) {
                const e = bkGesamtEntries[k];
                if (e && isBlue(e)) { e.value = ''; e.style.color = 'var(--text-normal)'; e.style.fontWeight = 'normal'; }
            }

            // Clear computed vals in tree
            const clrVals = n => { n.vals = {U:null,I:null,R:null,P:null}; n.children.forEach(clrVals); };
            clrVals(root);

            // Read table inputs into tree
            bkInputsSnap = new Map();
            for (const nd of bkLeafNodes) {
                const ents = bkTableRows.get(nd);
                if (ents) for (const k of ['U','I','R','P']) nd.vals[k] = bkReadEntry(ents[k]);
                bkInputsSnap.set(nd, { ...nd.vals });
            }

            // Read gesamt inputs
            const gRead = {};
            for (const k of ['U','I','R','P']) {
                gRead[k] = bkReadEntry(bkGesamtEntries[k]);
                if (root.vals[k] === null) root.vals[k] = gRead[k];
            }

            // Solve
            solveBaukasten(root);

            // Write results (blue = newly calculated)
            const sf = 4;
            for (const nd of bkLeafNodes) {
                const ents = bkTableRows.get(nd);
                const orig = bkInputsSnap.get(nd);
                if (!ents || !orig) continue;
                for (const k of ['U','I','R','P']) {
                    const val = nd.vals[k];
                    if (val !== null && isFinite(val) && orig[k] === null) {
                        ents[k].value = bkFmtVal(val, sf);
                        ents[k].style.color = CALC_BLUE;
                        ents[k].style.fontWeight = 'bold';
                    }
                }
                if (nd.vals.R !== null) nd.rVal = nd.vals.R;
            }
            for (const k of ['U','I','R','P']) {
                const val = root.vals[k];
                const e = bkGesamtEntries[k];
                if (val !== null && isFinite(val) && gRead[k] === null && e) {
                    e.value = bkFmtVal(val, sf);
                    e.style.color = CALC_BLUE; e.style.fontWeight = 'bold';
                }
            }

            const resEl = document.getElementById('bk-result');
            if (resEl) {
                const r = root.vals.R;
                resEl.textContent = r !== null ? `Ersatzwiderstand: ${bkFmtVal(r, sf)} Ω` : 'Ersatzwiderstand: —';
            }
            bkRedraw();
        }

        // --- Clear table ---
        function bkClearTable() {
            for (const [, ents] of bkTableRows)
                for (const k of ['U','I','R','P']) { ents[k].value = ''; ents[k].style.color = 'var(--text-normal)'; ents[k].style.fontWeight = 'normal'; }
            for (const k of ['U','I','R','P']) { const e = bkGesamtEntries[k]; if (e) { e.value = ''; e.style.color = 'var(--text-normal)'; e.style.fontWeight = 'normal'; } }
            for (const nd of bkLeafNodes) nd.rVal = null;
            const resEl = document.getElementById('bk-result');
            if (resEl) resEl.textContent = 'Ersatzwiderstand: —';
            bkRedraw();
        }

        // --- Init ---
        function initBaukastenCalculator() {
            document.getElementById('bk-btn-new').addEventListener('click', bkReset);
            document.getElementById('bk-btn-setr').addEventListener('click', bkSetRval);
            document.getElementById('bk-btn-parallel').addEventListener('click', () => bkCombine('parallel'));
            document.getElementById('bk-btn-series').addEventListener('click', () => bkCombine('series'));
            document.getElementById('bk-btn-dissolve').addEventListener('click', bkDissolve);
            document.getElementById('bk-btn-selall').addEventListener('click', bkSelectAll);
            document.getElementById('bk-btn-undo').addEventListener('click', bkUndo);
            document.getElementById('bk-btn-calc').addEventListener('click', bkCalculate);
            document.getElementById('bk-btn-clear-tbl').addEventListener('click', bkClearTable);
            const canvas = document.getElementById('bk-canvas');
            canvas.addEventListener('click', bkOnClick);
            new ResizeObserver(() => bkRedraw()).observe(canvas.parentElement);
            bkReset();
        }

        // Start
        init();
    </script>
</body>
</html>
